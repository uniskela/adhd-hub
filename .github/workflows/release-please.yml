name: Release Please

# A push to main is trusted only after uniskela manually merges a PR. Release
# Please then opens a release PR; it never merges that PR itself. When uniskela
# manually merges the release PR, Release Please creates the immutable tag and
# this run publishes the matching container image.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    # Prevent any other main-branch writer or automation from creating a
    # release PR or tag. Branch protection should separately restrict merging.
    if: github.actor == 'uniskela'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-images:
    needs: release-please
    if: >-
      github.actor == 'uniskela' &&
      needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
