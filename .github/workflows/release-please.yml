name: Release Please

# A push to main is trusted only after uniskela manually merges a PR. Release
# Please then opens a release PR; it never merges that PR itself. When uniskela
# manually merges the release PR, Release Please creates the immutable tag and
# this run publishes the matching container image.
#
# Do not hand-edit .release-please-manifest.json / package versions / CHANGELOG
# release headers in feature PRs. If the manifest version has no matching
# `vX.Y.Z` tag, Release Please walks the whole git history and can open a
# nonsense downgrade PR (e.g. 0.9.1 → 0.4.0). Version bumps belong only on the
# Release Please PR (or create the missing tag immediately after a manual bump).
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-gate:
    # Documentation and maintenance-only changes do not need a version. This
    # job reads only the push event; it cannot write a release or a PR.
    if: github.actor == 'uniskela'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Check out the trusted push range
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check whether this push can create a release
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: python3 scripts/release_gate.py "$BEFORE" "$AFTER" >> "$GITHUB_OUTPUT"

  release-please:
    needs: release-gate
    # Prevent any other main-branch writer or automation from creating a
    # release PR or tag. The gate also keeps docs/chore-only pushes from
    # opening a patch release. Branch protection separately restricts merging.
    if: needs.release-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-images:
    needs: release-please
    if: >-
      github.actor == 'uniskela' &&
      needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit


  notify-docs:
    needs: release-please
    if: >-
      github.actor == 'uniskela' &&
      needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check documentation App configuration
        env:
          APP_ID: ${{ vars.DOCS_SYNC_APP_ID }}
          APP_KEY: ${{ secrets.DOCS_SYNC_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo '::error::Configure DOCS_SYNC_APP_ID and DOCS_SYNC_APP_PRIVATE_KEY; see .github/docs-sync.md.'
            exit 1
          fi
      - name: Create short-lived destination token
        id: docs_app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.DOCS_SYNC_APP_ID }}
          private-key: ${{ secrets.DOCS_SYNC_APP_PRIVATE_KEY }}
          owner: uniskela
          repositories: .com
          permission-contents: write
      - name: Notify versioned documentation receiver
        env:
          GH_TOKEN: ${{ steps.docs_app.outputs.token }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          jq -n --arg repository "$SOURCE_REPO" --arg sha "$SOURCE_SHA" --arg ref "refs/heads/main" \
            '{event_type:"docs-source-updated",client_payload:{repository:$repository,sha:$sha,ref:$ref}}' > "$RUNNER_TEMP/docs-dispatch.json"
          gh api --method POST repos/uniskela/.com/dispatches --input "$RUNNER_TEMP/docs-dispatch.json"
