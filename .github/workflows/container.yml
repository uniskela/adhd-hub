name: Publish container images

# Called after Release Please creates a tag from a release PR merged by
# uniskela. workflow_dispatch is for rare catch-up publishes when a Git tag /
# GitHub Release already exists but images were never pushed (e.g. a hand-bumped
# version that skipped Release Please's release_created path).
on:
  workflow_call:
    inputs:
      tag:
        description: Immutable release tag created by Release Please (vX.Y.Z).
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)publish (vX.Y.Z).
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: uniskela/adhd-hub

jobs:
  publish:
    # Defence in depth: do not publish if this workflow is called outside the
    # canonical repository or from a main push not made by the maintainer.
    # Manual dispatch is also restricted to uniskela. Tag shape is validated
    # in a failing step (not job `if`) so a bad dispatch input fails loudly.
    if: >-
      github.repository == 'uniskela/adhd-hub' &&
      github.actor == 'uniskela'
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag shape
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a vX.Y.Z tag (with leading v), got: ${TAG:-<empty>}"
            exit 1
          fi

      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Confirm release tag exists
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag not found in this repository: $TAG"
            exit 1
          fi

      - name: Set image version values
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          MAJOR_MINOR="${VERSION%.*}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major_minor=$MAJOR_MINOR" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ env.IMAGE_NAME }}
            docker.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.major_minor }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=ADHD Progress Hub
            org.opencontainers.image.description=Self-hosted MCP + REST hub for unfinished coding work
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push release images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      # Hub README/short description from the tagged tree. PAT needs Read/Write/Delete.
      # Docker Hub truncates full descriptions at 25k bytes.
      - name: Detect Docker Hub credentials
        id: hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            echo "push_hub=1" >> "$GITHUB_OUTPUT"
          else
            echo "push_hub=0" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME/TOKEN unset; skipping Hub description update"
          fi

      # The Hub action completes URLs from GITHUB_REF_NAME (caller ref, usually
      # main). GitHub forbids overriding GITHUB_* env vars, so rewrite first.
      - name: Point relative README URLs at the release tag
        if: steps.hub.outputs.push_hub == '1'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/ci/complete-relative-readme-urls.py \
            README.md "$RUNNER_TEMP/dockerhub-readme.md" --ref "$TAG"

      - name: Docker Hub Description
        if: steps.hub.outputs.push_hub == '1'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          short-description: ${{ github.event.repository.description }}
          readme-filepath: ${{ runner.temp }}/dockerhub-readme.md
          enable-url-completion: false

