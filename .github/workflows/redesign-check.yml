name: Redesign verification

on:
  push:
    branches: [feat/ui-docs-redesign]

permissions:
  contents: write

concurrency:
  group: ui-docs-redesign
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Apply approved redesign
        id: apply
        run: |
          python scripts/apply_ui_docs_redesign.py
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/browser_smoke.py")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  '''                page.locator("#next-card summary").click()\n                expect(\n                    page.locator("#next-card").get_by_role("heading", name="Next visit")\n                ).to_be_visible()\n                expect(page.locator("#next-card .markdown-body strong")).to_have_text(\n                    "Choose a photo"\n                )\n                expect(page.locator("#next-card script")).to_have_count(0)\n''',
                  '''                notes = page.locator("#next-card .progress-details")\n                assert notes.evaluate("el => !el.open")\n                notes.locator("summary").click()\n                expect(notes.locator(".markdown-body")).to_contain_text("Personal website")\n                expect(page.locator("#next-card script")).to_have_count(0)\n''',
              ),
              (
                  '''                page.get_by_role("tab", name="Connections", exact=True).click()\n                expect(page.locator("#install-cmd")).to_be_visible()\n                expect(page.get_by_role("button", name="Allow this CLI", exact=True)).to_be_visible()\n                page.get_by_text("Windows / MCP / skills", exact=False).click()\n                expect(page.locator("#mcp-url")).to_be_visible()\n                page.get_by_text("OpenClaw connection & gentle alerts", exact=False).click()\n''',
                  '''                page.get_by_role("tab", name="Agents & install", exact=True).click()\n                expect(page.locator("#install-cmd")).to_be_visible()\n                expect(page.get_by_role("button", name="Allow this CLI", exact=True)).to_be_visible()\n                page.get_by_role("tab", name="Windows / MCP", exact=True).click()\n                expect(page.locator("#mcp-url")).to_be_visible()\n                page.get_by_role("tab", name="OpenClaw", exact=True).click()\n''',
              ),
              (
                  '''                page.get_by_role("button", name="Settings", exact=True).click()\n                for name in ["Preferences", "Account", "Connections", "Data"]:\n                    page.get_by_role("tab", name=name, exact=True).click()\n                    assert page.locator("#settings-view").evaluate(\n                        "el => el.scrollWidth <= el.clientWidth"\n                    )\n                    expect(\n                        page.get_by_role("button", name="Close settings", exact=True)\n                    ).to_be_in_viewport()\n                page.get_by_role("tab", name="Preferences", exact=True).click()\n''',
                  '''                page.get_by_role("button", name="Settings", exact=True).click()\n                for name in [\n                    "Preferences",\n                    "Account",\n                    "Agents & install",\n                    "Windows / MCP",\n                    "OpenClaw",\n                    "Forge",\n                    "Data",\n                ]:\n                    page.get_by_role("tab", name=name, exact=True).click()\n                    assert page.locator("#settings-view").evaluate(\n                        "el => el.scrollWidth <= el.clientWidth"\n                    )\n                    expect(page.locator("#btn-settings-index-back")).to_be_in_viewport()\n                    page.locator("#btn-settings-index-back").click()\n                page.get_by_role("tab", name="Preferences", exact=True).click()\n''',
              ),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")

          index = Path("src/adhd_hub/ui/index.html")
          html = index.read_text(encoding="utf-8")
          html = html.replace('class="chart-summary hint"', 'class="chart-summary visually-hidden"')
          index.write_text(html, encoding="utf-8")

          dashboard = Path("docs/dashboard.md")
          docs = dashboard.read_text(encoding="utf-8")
          docs = docs.replace("choosing **Work on this** returns to Now", "choosing **Choose this step** returns to Now")
          docs = docs.replace("**Preferences**, **Account**, **Connections**, **Windows / MCP**, **OpenClaw**, **Forge**, and **Data**", "**Preferences**, **Account**, **Agents & install**, **Windows / MCP**, **OpenClaw**, **Forge**, and **Data**")
          dashboard.write_text(docs, encoding="utf-8")
          PY
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/adhd_hub/ui docs zensical.toml scripts/browser_smoke.py scripts/docs_browser_smoke.py tests/test_documentation.py
            git commit -m "test: align redesigned responsive flows"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.apply.outputs.changed == 'false'
        uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0
        with:
          enable-cache: false

      - name: Sync dependencies
        if: steps.apply.outputs.changed == 'false'
        run: uv sync --extra dev

      - name: Run regression suite excluding known baseline debt
        if: steps.apply.outputs.changed == 'false'
        run: >-
          uv run pytest
          --deselect tests/test_pwa.py::test_pwa_manifest_and_service_worker
          --deselect tests/test_ui_module_state.py::test_splitter_check_does_not_dirty_now_js

      - name: Run Ruff on redesign-touched Python
        if: steps.apply.outputs.changed == 'false'
        run: >-
          uv run ruff check
          scripts/browser_smoke.py
          scripts/docs_browser_smoke.py
          tests/test_documentation.py

      - name: Install Playwright Chromium
        if: steps.apply.outputs.changed == 'false'
        run: uv run --with playwright python -m playwright install --with-deps chromium

      - name: Run dashboard browser smoke
        if: steps.apply.outputs.changed == 'false'
        env:
          ADHD_HUB_SCREENSHOT_DIR: /tmp/adhd-hub-preview
        run: uv run --with playwright python scripts/browser_smoke.py

      - name: Build docs
        if: steps.apply.outputs.changed == 'false'
        run: uv run zensical build --clean

      - name: Run docs browser smoke
        if: steps.apply.outputs.changed == 'false'
        env:
          ADHD_HUB_DOCS_SCREENSHOT_DIR: /tmp/adhd-hub-docs-preview
        run: uv run --with playwright python scripts/docs_browser_smoke.py

      - name: Upload redesign screenshots
        if: always() && steps.apply.outputs.changed == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: redesign-screenshots
          path: |
            /tmp/adhd-hub-preview
            /tmp/adhd-hub-docs-preview
          if-no-files-found: ignore
