name: Redesign verification

on:
  push:
    branches: [feat/ui-docs-redesign]

permissions:
  contents: write

concurrency:
  group: ui-docs-redesign
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Apply approved redesign
        id: apply
        run: |
          python scripts/apply_ui_docs_redesign.py
          python - <<'PY'
          from pathlib import Path

          index = Path("src/adhd_hub/ui/index.html")
          html = index.read_text(encoding="utf-8")
          if 'id="btn-close-project"' not in html:
              old = '        <button type="button" class="danger" id="btn-delete-project">Delete…</button>\n      </div>'
              new = '        <button type="button" class="danger" id="btn-delete-project">Delete…</button>\n        <button type="button" class="ghost" id="btn-close-project">Cancel</button>\n      </div>'
              if old not in html:
                  raise RuntimeError("project dialog action block not found")
              html = html.replace(old, new, 1)
              index.write_text(html, encoding="utf-8")

          boot = Path("src/adhd_hub/ui/js/boot.js")
          js = boot.read_text(encoding="utf-8")
          if '$("btn-close-project").addEventListener' not in js:
              old = '$("btn-edit-project").addEventListener("click", () => openProjectDialog(state.detailCache));'
              new = '$("btn-close-project").addEventListener("click", () => $("project-dialog").close());\n' + old
              if old not in js:
                  raise RuntimeError("project edit binding not found")
              js = js.replace(old, new, 1)
              boot.write_text(js, encoding="utf-8")
          PY
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/adhd_hub/ui docs zensical.toml scripts/browser_smoke.py scripts/docs_browser_smoke.py tests/test_documentation.py
            git commit -m "fix(ui): restore project dialog cancel action"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.apply.outputs.changed == 'false'
        uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0
        with:
          enable-cache: false

      - name: Sync dependencies
        if: steps.apply.outputs.changed == 'false'
        run: uv sync --extra dev

      - name: Run regression suite excluding known baseline debt
        if: steps.apply.outputs.changed == 'false'
        run: >-
          uv run pytest
          --deselect tests/test_pwa.py::test_pwa_manifest_and_service_worker
          --deselect tests/test_ui_module_state.py::test_splitter_check_does_not_dirty_now_js

      - name: Run Ruff on redesign-touched Python
        if: steps.apply.outputs.changed == 'false'
        run: >-
          uv run ruff check
          scripts/browser_smoke.py
          scripts/docs_browser_smoke.py
          tests/test_documentation.py

      - name: Install Playwright Chromium
        if: steps.apply.outputs.changed == 'false'
        run: uv run --with playwright python -m playwright install --with-deps chromium

      - name: Run dashboard browser smoke
        if: steps.apply.outputs.changed == 'false'
        env:
          ADHD_HUB_SCREENSHOT_DIR: /tmp/adhd-hub-preview
        run: uv run --with playwright python scripts/browser_smoke.py

      - name: Build docs
        if: steps.apply.outputs.changed == 'false'
        run: uv run zensical build --clean

      - name: Run docs browser smoke
        if: steps.apply.outputs.changed == 'false'
        env:
          ADHD_HUB_DOCS_SCREENSHOT_DIR: /tmp/adhd-hub-docs-preview
        run: uv run --with playwright python scripts/docs_browser_smoke.py

      - name: Upload redesign screenshots
        if: always() && steps.apply.outputs.changed == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: redesign-screenshots
          path: |
            /tmp/adhd-hub-preview
            /tmp/adhd-hub-docs-preview
          if-no-files-found: ignore
