name: Release (manual)

# Emergency / explicit bump when you do not want to wait for conventional
# commits + Release Please. Prefer Release Please for day-to-day releases.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      version:
        description: Optional exact version (overrides bump), e.g. 1.2.3
        required: false
        type: string
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bump version
        id: bump
        run: |
          set -euo pipefail
          ARG="${{ inputs.version }}"
          if [ -z "$ARG" ]; then
            ARG="${{ inputs.bump }}"
          fi
          NEW="$(python scripts/bump_version.py "$ARG")"
          echo "version=${NEW}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW}" >> "$GITHUB_OUTPUT"
          echo "Bumped to ${NEW}"

      - name: Commit version bump
        env:
          VER: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f .release-please-manifest.json ]; then
            python -c "import json,pathlib; p=pathlib.Path('.release-please-manifest.json'); d=json.loads(p.read_text()); d['.']='${VER}'; p.write_text(json.dumps(d,indent=2)+'\n')"
            git add .release-please-manifest.json
          fi
          git add pyproject.toml docker-compose.yml
          git commit -m "chore: release ${TAG}"
          git tag -a "${TAG}" -m "Release ${TAG}"

      - name: Push commit and tag
        run: |
          set -euo pipefail
          git push origin HEAD:${{ github.ref_name }}
          git push origin "${{ steps.bump.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          generate_release_notes: true
          make_latest: true

      - name: Publish container images for release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run "Container images" --repo "${{ github.repository }}" --ref "${TAG}"
