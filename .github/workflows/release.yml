name: Release

# Bumps semver in-repo, pushes an annotated git tag (vX.Y.Z), and publishes a
# GitHub Release. The Container images workflow then tags GHCR + Docker Hub
# with the same version (and latest).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump (or exact X.Y.Z)
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      version:
        description: Optional exact version (overrides bump when set), e.g. 1.2.3
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bump version
        id: bump
        run: |
          set -euo pipefail
          ARG="${{ inputs.version }}"
          if [ -z "$ARG" ]; then
            ARG="${{ inputs.bump }}"
          fi
          NEW="$(python scripts/bump_version.py "$ARG")"
          echo "version=${NEW}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW}" >> "$GITHUB_OUTPUT"
          echo "Bumped to ${NEW}"

      - name: Commit version bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml docker-compose.yml
          git commit -m "chore: release ${{ steps.bump.outputs.tag }}"
          git tag -a "${{ steps.bump.outputs.tag }}" -m "Release ${{ steps.bump.outputs.tag }}"

      - name: Push commit and tag
        run: |
          set -euo pipefail
          git push origin HEAD:${{ github.ref_name }}
          git push origin "${{ steps.bump.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          generate_release_notes: true
          make_latest: true
