name: Finalize MCP stdio transport

on:
  push:
    branches:
      - feat/mcp-stdio-transport

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/mcp-stdio-transport
          fetch-depth: 0

      - name: Apply implementation and clean Markdown
        shell: python
        run: |
          from pathlib import Path

          helper = Path('.github/workflows/apply-mcp-stdio.yml').read_text(encoding='utf-8')
          section = helper.split('      - name: Apply implementation and docs\n', 1)[1]
          run_block = section.split('      - name: Install uv\n', 1)[0]
          code = run_block.split('        run: |\n', 1)[1]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in code.splitlines())
          exec(compile(code, 'apply-mcp-stdio.yml', 'exec'))

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old = (
              'MCP (recommended persistent/shared transport): `http://<host>:8787/mcp`  \n'
              'MCP (optional local subprocess transport): `adhd-hub mcp-stdio`  \n'
              'REST docs: `http://<host>:8787/docs`  \n'
              'UI: `http://<host>:8787/ui/`'
          )
          new = (
              '- MCP (recommended persistent/shared transport): `http://<host>:8787/mcp`\n'
              '- MCP (optional local subprocess transport): `adhd-hub mcp-stdio`\n'
              '- REST docs: `http://<host>:8787/docs`\n'
              '- UI: `http://<host>:8787/ui/`'
          )
          if old not in text:
              raise SystemExit('README endpoint block not found')
          readme.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      - name: Verify feature
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev --frozen
          uv run pytest -q tests/test_mcp_stdio.py
          uv run pytest -q
          uv run ruff check src tests
          git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-mcp-stdio.yml .github/workflows/finalize-mcp-stdio.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add stdio MCP transport"
          git push origin HEAD:feat/mcp-stdio-transport
