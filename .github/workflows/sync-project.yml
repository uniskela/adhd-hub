name: Sync ADHD Hub project guidance

# Reusable workflow for downstream repositories.
# Consumers should wrap this with a tiny workflow_call caller, e.g.:
#
#   jobs:
#     sync:
#       uses: uniskela/adhd-hub/.github/workflows/sync-project.yml@<sha>
#       permissions:
#         contents: write
#         pull-requests: write
#       with:
#         agents: "cursor,codex"
#
# Pin an immutable commit SHA until a stable `v1` tag is published. Do not push to main.

on:
  workflow_call:
    inputs:
      agents:
        description: Comma list passed to adhd-hub sync-project --agents
        type: string
        required: false
        default: "cursor,codex"
      hub_ref:
        description: ADHD Hub git ref to sync FROM (tag, branch, or SHA)
        type: string
        required: false
        default: "main"
      branch_prefix:
        description: Branch name prefix for generated sync PRs
        type: string
        required: false
        default: "chore/adhd-hub-sync"
      pr_labels:
        description: Optional comma-separated labels for the sync PR
        type: string
        required: false
        default: "adhd-hub,automated"
    secrets:
      APP_ID:
        description: Optional GitHub App id for stronger automation tokens
        required: false
      APP_PRIVATE_KEY:
        description: Optional GitHub App private key
        required: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: adhd-hub-project-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Resolve token
        id: auth
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${APP_ID:-}" ] && [ -n "${APP_PRIVATE_KEY:-}" ]; then
            echo "mode=app" >> "$GITHUB_OUTPUT"
          else
            echo "mode=github_token" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub App token
        id: app
        if: steps.auth.outputs.mode == 'app'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout consumer repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project
          fetch-depth: 0
          token: ${{ steps.auth.outputs.mode == 'app' && steps.app.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Checkout ADHD Hub source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: uniskela/adhd-hub
          ref: ${{ inputs.hub_ref }}
          path: hub
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install ADHD Hub from checkout
        run: |
          set -euo pipefail
          python -m pip install -U pip
          # Non-editable install exercises packaged skills/adapters share data.
          python -m pip install "./hub"

      - name: Capture Hub identity
        id: hubmeta
        working-directory: hub
        env:
          HUB_REF_INPUT: ${{ inputs.hub_ref }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          short="$(printf '%s' "$sha" | cut -c1-7)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "ref=${HUB_REF_INPUT}" >> "$GITHUB_OUTPUT"

      - name: Sync project (check)
        id: check
        working-directory: project
        env:
          AGENTS: ${{ inputs.agents }}
        run: |
          set -euo pipefail
          set +e
          adhd-hub sync-project . --source ../hub --agents "$AGENTS" --check
          code=$?
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 1 ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi

      - name: Apply sync when drifted
        if: steps.check.outputs.drift == 'true'
        working-directory: project
        env:
          AGENTS: ${{ inputs.agents }}
        run: |
          set -euo pipefail
          adhd-hub sync-project . --source ../hub --agents "$AGENTS"
          adhd-hub sync-project . --source ../hub --agents "$AGENTS" --check

      - name: Commit and open or update PR
        if: steps.check.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ steps.auth.outputs.mode == 'app' && steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          BRANCH_PREFIX: ${{ inputs.branch_prefix }}
          HUB_SHA: ${{ steps.hubmeta.outputs.sha }}
          HUB_SHORT: ${{ steps.hubmeta.outputs.short }}
          HUB_REF: ${{ steps.hubmeta.outputs.ref }}
          PR_LABELS: ${{ inputs.pr_labels }}
          REPO: ${{ github.repository }}
          AGENTS: ${{ inputs.agents }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        working-directory: project
        run: |
          set -euo pipefail
          branch="${BRANCH_PREFIX}-${HUB_SHORT}"
          base="${DEFAULT_BRANCH:-main}"
          git config user.name "adhd-hub-project-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$base"
          git checkout -B "$branch" "origin/${base}"

          # Re-apply on the sync branch tip (idempotent).
          adhd-hub sync-project . --source ../hub --agents "$AGENTS"

          git add -- \
            AGENTS.md \
            .cursor/rules/adhd-hub.mdc \
            .agents/skills/adhd-hub-projects \
            .agents/skills/adhd-hub-session \
            .agents/skills/env-check \
            skills-lock.json || true

          if [ -f .agents/skills/env-check/scripts/check_runtime.sh ]; then
            git update-index --chmod=+x .agents/skills/env-check/scripts/check_runtime.sh || true
          fi

          if git diff --cached --quiet; then
            echo "No staged changes after sync; exiting cleanly."
            exit 0
          fi

          git commit -m "chore: sync ADHD Hub project guidance from ${HUB_SHORT}"

          # Lease against the known remote tip when the generated branch exists.
          if git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}" 2>/dev/null; then
            git push --force-with-lease="refs/heads/${branch}:refs/remotes/origin/${branch}" \
              origin "HEAD:refs/heads/${branch}"
          else
            git push origin "HEAD:refs/heads/${branch}"
          fi

          body_file="$RUNNER_TEMP/adhd-hub-sync-pr-body.md"
          {
            echo "<!-- adhd-hub-sync-generated -->"
            echo "## ADHD Hub project sync"
            echo
            echo "Generated by the reusable workflow"
            echo "\`uniskela/adhd-hub/.github/workflows/sync-project.yml\`."
            echo
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Hub ref | \`${HUB_REF}\` |"
            echo "| Hub SHA | [\`${HUB_SHA}\`](https://github.com/uniskela/adhd-hub/commit/${HUB_SHA}) |"
            echo "| Validation | \`adhd-hub sync-project --check\` after apply |"
            echo
            echo "These files are **generated** from the canonical ADHD Hub skills/guidance."
            echo "Prefer reviewing this PR rather than hand-editing downstream skill copies."
            echo
            echo "Human review is expected. Auto-merge is not enabled."
          } > "$body_file"

          title="chore: sync ADHD Hub guidance from ${HUB_SHORT}"
          existing="$(gh pr list --repo "$REPO" --state open --head "$branch" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$REPO" --title "$title" --body-file "$body_file"
            echo "Updated PR #$existing"
          else
            # Close older open sync PRs with the same prefix as superseded.
            # Only close PRs that carry the workflow marker so unrelated consumer
            # branches sharing BRANCH_PREFIX are left alone.
            while read -r num; do
              [ -z "$num" ] && continue
              gh pr comment "$num" --repo "$REPO" \
                --body "Superseded by ADHD Hub sync from \`${HUB_SHORT}\` (\`${HUB_SHA}\`)."
              gh pr close "$num" --repo "$REPO" >/dev/null || true
            done < <(gh pr list --repo "$REPO" --state open \
              --json number,headRefName,body \
              | jq -r --arg prefix "$BRANCH_PREFIX" \
                '.[] | select((.headRefName | startswith($prefix + "-")) and ((.body // "") | contains("<!-- adhd-hub-sync-generated -->"))) | .number')

            label_args=()
            IFS=',' read -ra labels <<< "$PR_LABELS"
            for label in "${labels[@]}"; do
              label="$(echo "$label" | xargs)"
              [ -z "$label" ] && continue
              label_args+=(--label "$label")
            done || true

            if ! gh pr create --repo "$REPO" --base "$base" --head "$branch" \
              --title "$title" --body-file "$body_file" "${label_args[@]}"; then
              # Labels may be missing on the repo — retry without them.
              gh pr create --repo "$REPO" --base "$base" --head "$branch" \
                --title "$title" --body-file "$body_file"
            fi
          fi
