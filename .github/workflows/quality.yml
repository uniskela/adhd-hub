name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  UV_PYTHON: "3.12"
  # Fail instead of silently re-resolving when uv.lock no longer matches
  # pyproject.toml. Release Please bumps both files in the release PR
  # (release-please-config.json extra-files), so this holds across releases.
  UV_LOCKED: "true"

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Sync development dependencies
        run: uv sync --extra dev --locked

      - name: Run test suite
        run: uv run pytest -q

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Sync development dependencies
        run: uv sync --extra dev --locked

      - name: Run Ruff
        run: uv run ruff check src tests

      - name: Check whitespace errors
        run: git diff --check
