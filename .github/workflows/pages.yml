name: Deploy documentation site

# Documentation is deployed only from the protected main branch after a merge.
# This workflow intentionally has no pull_request or workflow_dispatch trigger.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pages.yml"

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    # The site is public and must be built only from the canonical repository
    # after uniskela has merged the change to protected main.
    if: github.repository == 'uniskela/adhd-hub' && github.actor == 'uniskela'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      - name: Sync Python dependencies
        run: uv sync --extra dev

      - name: Build the documentation site
        run: uv run zensical build --clean

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
