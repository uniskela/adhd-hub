name: Deploy documentation site

# Documentation is deployed only from the protected main branch after a merge.
# This workflow intentionally has no pull_request or workflow_dispatch trigger.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pages.yml"

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    # The site is public and must be built only from the canonical repository
    # after uniskela has merged the change to protected main.
    if: github.repository == 'uniskela/adhd-hub' && github.actor == 'uniskela'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out trusted main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0
        with:
          enable-cache: false

      - name: Sync Python dependencies
        run: uv sync --extra dev

      - name: Build the documentation site
        run: uv run zensical build --clean

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
