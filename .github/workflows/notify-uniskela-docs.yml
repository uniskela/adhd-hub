name: Notify Uniskela documentation
on:
  push:
    branches: [main]
    paths:
      - README.md
      - docs/**
      - site/src/content/docs/**
      - .github/workflows/notify-uniskela-docs.yml
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notify-uniskela-docs
  cancel-in-progress: false
jobs:
  notify:
    if: github.repository == 'uniskela/adhd-hub' && (github.event_name == 'release' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Check App configuration
        env:
          APP_ID: ${{ vars.DOCS_SYNC_APP_ID }}
          APP_KEY: ${{ secrets.DOCS_SYNC_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo '::error::Configure DOCS_SYNC_APP_ID and DOCS_SYNC_APP_PRIVATE_KEY; see .github/docs-sync.md.'
            exit 1
          fi
      - name: Resolve trusted source commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            echo "sha=$(gh api repos/$GITHUB_REPOSITORY/commits/main --jq .sha)" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
          echo "ref=refs/heads/main" >> "$GITHUB_OUTPUT"
      - name: Create short-lived destination token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.DOCS_SYNC_APP_ID }}
          private-key: ${{ secrets.DOCS_SYNC_APP_PRIVATE_KEY }}
          owner: uniskela
          repositories: .com
          permission-contents: write
      - name: Notify the documentation receiver
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_REF: ${{ steps.source.outputs.ref }}
        run: |
          jq -n --arg repository "$SOURCE_REPO" --arg sha "$SOURCE_SHA" --arg ref "$SOURCE_REF" \
            '{event_type:"docs-source-updated",client_payload:{repository:$repository,sha:$sha,ref:$ref}}' > "$RUNNER_TEMP/docs-dispatch.json"
          gh api --method POST repos/uniskela/.com/dispatches --input "$RUNNER_TEMP/docs-dispatch.json"
