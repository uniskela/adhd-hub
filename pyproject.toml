[project]
name = "adhd-hub"
version = "0.22.0"
description = "Self-hosted ADHD progress hub — MCP + REST for unfinished threads, wiki progress, and optional OpenClaw nudges."
readme = "README.md"
authors = [
    { name = "Uniskela", email = "104075208+uniskela@users.noreply.github.com" }
]
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["adhd", "mcp", "productivity", "openclaw", "cursor", "codex"]
dependencies = [
    "apscheduler>=3.11.3",
    # Floor for GHSA-6q48-6c7w-9gw2 (Trivy CRITICAL in release image).
    "certifi>=2026.10.18",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "markdown-it-py>=4.0.0",
    "mcp[cli]>=2.2.0",
    # Floor for CVE-2026-102268 family (transitive via mcp); keep >= fixed releases.
    "pyjwt[crypto]>=2.14.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "tomli-w>=1.2.0",
    "truststore>=0.10.5",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.52.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
    "zensical>=0.0.73",
]

[project.scripts]
adhd-hub = "adhd_hub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adhd_hub"]

[tool.hatch.build]
include = [
  "src/adhd_hub/ui/**",
  "skills/**",
  "adapters/**",
]

[tool.hatch.build.targets.wheel.force-include]
"src/adhd_hub/ui/index.html" = "adhd_hub/ui/index.html"
"src/adhd_hub/ui/app.css" = "adhd_hub/ui/app.css"
"src/adhd_hub/ui/app.js" = "adhd_hub/ui/app.js"
"src/adhd_hub/ui/manifest.webmanifest" = "adhd_hub/ui/manifest.webmanifest"
"src/adhd_hub/ui/sw.js" = "adhd_hub/ui/sw.js"
# Canonical project-sync assets for installed (non-editable) wheels.
"skills" = "adhd_hub/share/skills"
"adapters" = "adhd_hub/share/adapters"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
