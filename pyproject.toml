[project]
name = "adhd-hub"
version = "0.4.0"
description = "Self-hosted ADHD progress hub — MCP + REST for unfinished threads, wiki progress, and optional OpenClaw nudges."
readme = "README.md"
authors = [
    { name = "Uniskela", email = "104075208+uniskela@users.noreply.github.com" }
]
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["adhd", "mcp", "productivity", "openclaw", "cursor", "codex"]
dependencies = [
    "apscheduler>=3.11.3",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "markdown-it-py>=4.0.0",
    "mcp[cli]>=2.2.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "tomli-w>=1.2.0",
    "tzdata>=2025.1",
    "uvicorn[standard]>=0.52.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.16.0",
    "zensical>=0.0.60",
]

[project.scripts]
adhd-hub = "adhd_hub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adhd_hub"]

[tool.hatch.build]
include = [
  "src/adhd_hub/ui/**",
]

[tool.hatch.build.targets.wheel.force-include]
"src/adhd_hub/ui/index.html" = "adhd_hub/ui/index.html"
"src/adhd_hub/ui/app.css" = "adhd_hub/ui/app.css"
"src/adhd_hub/ui/app.js" = "adhd_hub/ui/app.js"
"src/adhd_hub/ui/manifest.webmanifest" = "adhd_hub/ui/manifest.webmanifest"
"src/adhd_hub/ui/sw.js" = "adhd_hub/ui/sw.js"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
